name: CI and cPanel deployment
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      target:
        description: Deployment target (none builds a downloadable release)
        type: choice
        default: none
        options: [none, staging, production]
concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: ci-only-password
          MYSQL_DATABASE: metrial_test
        ports: [3306:3306]
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -pci-only-password"
          --health-interval=5s --health-timeout=5s --health-retries=20
      redis:
        image: redis:7-alpine
        ports: [6379:6379]
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s --health-timeout=5s --health-retries=20
    env:
      APP_ENV: testing
      APP_DEBUG: false
      LOG_CHANNEL: stderr
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: metrial_test
      DB_USERNAME: root
      DB_PASSWORD: ci-only-password
      DB_URL: ''
      REDIS_HOST: 127.0.0.1
      REDIS_PORT: 6379
      REDIS_PREFIX: metrial_ci_
      REDIS_PASSWORD: 'null'
      RUN_REDIS_INTEGRATION: 1
      CACHE_STORE: array
      QUEUE_CONNECTION: sync
      SESSION_DRIVER: array
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@b604ade2a87db23f8871b7182e69ec5e75effb45 # v2
        with:
          php-version: '8.5'
          extensions: mbstring, intl, pdo_mysql, pdo_sqlite, bcmath
          coverage: none
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
      - run: composer install --no-interaction --prefer-dist
      - run: cp .env.example .env
      - run: php artisan key:generate --no-interaction
      - run: composer validate --strict
      - run: composer audit
      - name: Check PHP formatting
        run: |
          vendor/bin/pint --format agent
          git diff --exit-code
      - run: vendor/bin/phpstan analyse --no-progress
      - run: mkdir -p test-results
      - run: php artisan test --compact --log-junit test-results/phpunit.xml
      - run: php artisan migrate:fresh --seed --force --no-interaction
      - run: php artisan db:seed --force --no-interaction
      - run: npm ci
      - run: npm --prefix docker/socketio ci
      - run: npm audit
      - run: npm --prefix docker/socketio audit
      - run: npm run build
      - run: node --test docker/socketio/*.test.cjs docker/deploy/*.test.cjs
        env:
          TEST_REDIS_PORT: 6379
          REDIS_PASSWORD: ''
      - run: docker compose config --quiet
      - name: Validate deployment shell scripts
        run: |
          for script in docker/deploy/*.sh; do bash -n "$script"; done
          shellcheck docker/deploy/*.sh
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: always()
        with:
          name: test-results
          path: test-results/
          retention-days: 7

  production-smoke:
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Build app image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: docker/production/Dockerfile
          target: app
          load: true
          tags: metrial-ci-app:local
          cache-from: type=gha,scope=app
          cache-to: type=gha,mode=max,scope=app
      - name: Build web image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: docker/production/Dockerfile
          target: web
          load: true
          tags: metrial-ci-web:local
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web
      - name: Build socket image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: docker/socketio/Dockerfile
          load: true
          tags: metrial-ci-socket:local
          cache-from: type=gha,scope=socket
          cache-to: type=gha,mode=max,scope=socket
      - name: Boot production stack with disposable database and Redis
        run: bash docker/deploy/smoke.sh

  release:
    needs: [verify, production-smoke]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@b604ade2a87db23f8871b7182e69ec5e75effb45 # v2
        with:
          php-version: '8.5'
          extensions: mbstring, intl, pdo_mysql, bcmath
          coverage: none
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
      - run: composer install --no-dev --no-scripts --no-interaction --prefer-dist
      - run: npm ci --ignore-scripts
      - run: npm run build
      - run: bash docker/deploy/package.sh
      - name: Verify the exact cPanel release artifact
        run: node --test docker/deploy/artifact.test.cjs
        env:
          TEST_RELEASE_ARCHIVE: dist/release.tar.gz
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: cpanel-release-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: dist/release.tar.gz*
          retention-days: 14
          if-no-files-found: error

  deploy:
    needs: release
    if: >-
      github.ref == 'refs/heads/main' &&
      ((github.event_name == 'workflow_dispatch' && inputs.target != 'none') ||
       (github.event_name == 'push' && vars.STAGING_AUTO_DEPLOY == 'true'))
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: ${{ inputs.target == 'production' && 'production' || 'staging' }}
    concurrency:
      group: cpanel-${{ inputs.target == 'production' && 'production' || 'staging' }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: cpanel-release-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: dist
      - name: Deploy verified release over SSH
        run: bash docker/deploy/remote.sh deploy
        env:
          RELEASE_ID: ${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          DEPLOY_ENVIRONMENT: ${{ inputs.target == 'production' && 'production' || 'staging' }}
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ vars.DEPLOY_PORT }}
          DEPLOY_USER: ${{ vars.DEPLOY_USER }}
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
