services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
      args:
        WWWUSER: ${WWWUSER:-1000}
        WWWGROUP: ${WWWGROUP:-1000}
    container_name: metrial_app
    restart: unless-stopped
    environment:
      - APP_ENV=${APP_ENV:-local}
      - APP_DEBUG=${APP_DEBUG:-false}
      - APP_URL=${APP_URL:-http://localhost}
      - DB_CONNECTION=${DB_CONNECTION:-mysql}
      - DB_HOST=${DB_HOST:-db}
      - DB_PORT=${DB_PORT:-3306}
      - DB_DATABASE=${DB_DATABASE:-metrial}
      - DB_USERNAME=${DB_USERNAME:-metrial}
      - DB_PASSWORD=${DB_PASSWORD:-metrial}
      - REDIS_CLIENT=${REDIS_CLIENT:-predis}
      - REDIS_HOST=${REDIS_HOST:-redis}
      - REDIS_PORT=${REDIS_PORT:-6379}
      # Must match the socketio service or the relay subscribes elsewhere.
      - REDIS_PREFIX=${REDIS_PREFIX:-metrial_}
      - QUEUE_CONNECTION=redis
      - SOCKET_IO_HOST=${SOCKET_IO_HOST:-socketio}
      - SOCKET_IO_PORT=${SOCKET_IO_PORT:-6001}
      - LARAVEL_SAIL=false
      - XDEBUG_MODE=${XDEBUG_MODE:-off}
      - XDEBUG_CONFIG=${XDEBUG_CONFIG:-}
    volumes:
      - .:/var/www/html
      - composer-cache:/root/.composer
      # Bind-mounted (not COPY-ed) so the FPM listen address can never be
      # shadowed by a stale image layer. Overrides the base image defaults.
      - ./docker/php/zz-docker.conf:/usr/local/etc/php-fpm.d/zz-docker.conf:ro
    depends_on:
      - db
      - redis
      - socketio
    networks:
      - metrial-network

  web:
    build:
      context: .
      dockerfile: docker/nginx/Dockerfile
    container_name: metrial_web
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - .:/var/www/html
      # Bind-mounted so the vhost config is always the one in the repo,
      # independent of image build cache.
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    networks:
      - metrial-network

  socketio:
    build:
      context: .
      dockerfile: docker/socketio/Dockerfile
    container_name: metrial_socketio
    restart: unless-stopped
    ports:
      - "${SOCKET_IO_HOST_PORT:-6001}:6001"
    environment:
      - REDIS_HOST=${REDIS_HOST:-redis}
      - REDIS_PORT=${REDIS_PORT:-6379}
      # Same value as the app/queue services: it is the pub/sub channel prefix.
      - REDIS_PREFIX=${REDIS_PREFIX:-metrial_}
      - SOCKET_IO_PORT=${SOCKET_IO_PORT:-6001}
      - SOCKET_TOKEN_SECRET=${SOCKET_TOKEN_SECRET:-}
      - REDIS_PASSWORD=${REDIS_PASSWORD:-}
      - CORS_ORIGIN=${CORS_ORIGIN:-http://localhost:3000,http://localhost}
    depends_on:
      - redis
    networks:
      - metrial-network

  redis:
    image: redis:7-alpine
    container_name: metrial_redis
    restart: unless-stopped
    ports:
      - "127.0.0.1:${REDIS_HOST_PORT:-6379}:6379"
    command: redis-server --appendonly yes --save "" --maxmemory 256mb --maxmemory-policy noeviction
    volumes:
      - redis-data:/data
    networks:
      - metrial-network

  db:
    image: mysql:8.0
    container_name: metrial_db
    restart: unless-stopped
    ports:
      - "127.0.0.1:${DB_HOST_PORT:-3308}:3306"
    environment:
      - MYSQL_ROOT_PASSWORD=${DB_ROOT_PASSWORD:-root}
      - MYSQL_DATABASE=${DB_DATABASE:-metrial}
      - MYSQL_USER=${DB_USERNAME:-metrial}
      - MYSQL_PASSWORD=${DB_PASSWORD:-metrial}
    volumes:
      - db-data:/var/lib/mysql
    networks:
      - metrial-network

  queue: &queue-service
    build:
      context: .
      dockerfile: docker/php/Dockerfile
      args:
        WWWUSER: ${WWWUSER:-1000}
        WWWGROUP: ${WWWGROUP:-1000}
    container_name: metrial_queue
    restart: unless-stopped
    user: "${WWWUSER:-1000}:${WWWGROUP:-1000}"
    command: php /var/www/html/artisan queue:work redis --sleep=3 --tries=5 --timeout=60 --max-time=3600
    environment:
      - APP_ENV=${APP_ENV:-local}
      - APP_DEBUG=${APP_DEBUG:-false}
      - DB_CONNECTION=${DB_CONNECTION:-mysql}
      - DB_HOST=${DB_HOST:-db}
      - DB_PORT=${DB_PORT:-3306}
      - DB_DATABASE=${DB_DATABASE:-metrial}
      - DB_USERNAME=${DB_USERNAME:-metrial}
      - DB_PASSWORD=${DB_PASSWORD:-metrial}
      - REDIS_CLIENT=${REDIS_CLIENT:-predis}
      - REDIS_HOST=${REDIS_HOST:-redis}
      - REDIS_PORT=${REDIS_PORT:-6379}
      - REDIS_PREFIX=${REDIS_PREFIX:-metrial_}
      - QUEUE_CONNECTION=redis
      - SOCKET_IO_HOST=${SOCKET_IO_HOST:-socketio}
      - SOCKET_IO_PORT=${SOCKET_IO_PORT:-6001}
      - DB_HOST_PORT=${DB_HOST_PORT:-3308}
    volumes:
      - .:/var/www/html
    depends_on:
      - db
      - redis
      - socketio
    networks:
      - metrial-network

  scheduler:
    <<: *queue-service
    container_name: metrial_scheduler
    command: php /var/www/html/artisan schedule:work

networks:
  metrial-network:
    driver: bridge

volumes:
  composer-cache:
  redis-data:
  db-data:
