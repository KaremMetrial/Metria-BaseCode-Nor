# === Docker Nginx default virtual host ===
# Docker's embedded DNS. Used below so the FPM upstream is re-resolved at
# request time instead of being cached once at startup -- otherwise recreating
# the `app` container (new IP) leaves Nginx pointing at a dead address.
resolver 127.0.0.11 valid=10s ipv6=off;

server {
    listen 80;
    listen [::]:80;
    root /var/www/html/public;
    index index.php index.html;

    server_name _;

    charset utf-8;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    error_page 404 /index.php;

    location = /index.php {
        # Variable + resolver => dynamic re-resolution of the app container.
        set $fpm_upstream app:9000;
        fastcgi_pass $fpm_upstream;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
    }

    location ~ \.php$ { return 404; }

    location ~ /\.(?!well-known/) {
        deny all;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
