[global]
daemonize = no

[www]
; Bind IPv4 wildcard explicitly. The php base image's docker.conf defaults to
; `listen = 9000`, which can bind IPv6-only and makes Nginx's IPv4 upstream
; (fastcgi_pass app:9000) fail with 111 Connection refused.
listen = 0.0.0.0:9000
listen.mode = 0666

; NOTE: do NOT set `listen.allowed_clients = any` -- PHP-FPM rejects "any" as an
; invalid IP and then drops every connection ("There are no allowed addresses").
; Leaving the directive unset allows all clients, which is what we want for the
; sibling Nginx container on the same Docker network.
