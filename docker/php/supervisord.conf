; === Docker Supervisor config for the app (PHP-FPM) container ===
; The queue worker runs in its own `queue` service/container, so this container
; is intentionally single-purpose: it only supervises php-fpm.
[supervisord]
nodaemon=true
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisord.pid

[program:php-fpm]
command=php-fpm
autostart=true
autorestart=true
user=root
stdout_logfile=/var/log/supervisor/php-fpm.log
stderr_logfile=/var/log/supervisor/php-fpm.err.log
priority=1
